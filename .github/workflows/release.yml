# Release: push a tag like v0.2.0
#   git tag v0.2.0 && git push origin v0.2.0
# Creates a GitHub release with the plugin packages and pushes the proxy image to
# ghcr.io/<owner>/euro-office-worksheet-assistant:<version> and :latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: |
          npm ci
          npm --prefix proxy ci
          npm test

      - name: Build plugin
        env:
          PLUGIN_VERSION: ${{ github.ref_name }}
        run: bash scripts/build.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the section "## <version>" of CHANGELOG.md, otherwise generated notes.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/worksheet-assistant.tar.gz dist/worksheet-assistant.zip dist/worksheet-assistant.plugin scripts/install-aio.sh \
            --title "$GITHUB_REF_NAME" "${notes[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-folder
          path: dist/worksheet-assistant/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Proxy image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Server of the Euro-Office worksheet assistant (AI chat proxy and MCP endpoint)
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/${{ github.repository_owner }}/euro-office-worksheet-assistant:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/euro-office-worksheet-assistant:latest

  # Companion app (desktop editors), attached to the release created above.
  companion:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS: its Linux build does not need libatomic (Node >= 25 does)
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: plugin-folder
          path: dist/worksheet-assistant
      - name: Build
        run: |
          npm ci
          npm --prefix proxy ci
          node scripts/build-companion.mjs
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/worksheet-assistant-* --clobber
