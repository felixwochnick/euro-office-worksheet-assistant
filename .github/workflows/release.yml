# Release: push a tag like v0.2.0
#   git tag v0.2.0 && git push origin v0.2.0
# Creates a GitHub release with the plugin packages and pushes the proxy image to
# ghcr.io/<owner>/eurooffice-music-notation-proxy:<version> and :latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: |
          npm ci
          npm --prefix proxy ci
          npm test

      - name: Build plugin
        env:
          PLUGIN_VERSION: ${{ github.ref_name }}
        run: bash scripts/build.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the section "## <version>" of CHANGELOG.md, otherwise generated notes.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/music-notation.tar.gz dist/music-notation.zip dist/music-notation.plugin scripts/install-aio.sh \
            --title "$GITHUB_REF_NAME" "${notes[@]}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Proxy image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=LLM proxy for the Euro-Office music notation plugin
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/${{ github.repository_owner }}/eurooffice-music-notation-proxy:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/eurooffice-music-notation-proxy:latest
