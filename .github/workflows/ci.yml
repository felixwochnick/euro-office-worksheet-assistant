name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix proxy ci

      - name: Unit tests (shared ABC helpers + proxy)
        run: npm test

      - name: Build plugin
        run: bash scripts/build.sh

      - name: Install script (syntax, systemd unit)
        run: |
          bash -n scripts/install-aio.sh
          scripts/install-aio.sh --print-unit > /tmp/eurooffice-worksheet-assistant.service
          systemd-analyze verify /tmp/eurooffice-worksheet-assistant.service || true

      - name: End-to-end test (harness + mock proxy)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          PROXY_URL: http://localhost:8788
        run: |
          (cd proxy && LLM_PROVIDER=mock PROXY_TOKEN=dev-token-change-me-0123 \
            CORS_ORIGINS=http://localhost:8080 PORT=8788 LOG_LEVEL=warn node build/src/server.js &)
          node scripts/serve.mjs 8080 &
          for i in $(seq 1 30); do curl -fs http://localhost:8788/healthz && curl -fs -o /dev/null http://localhost:8080/harness/ && break; sleep 1; done
          node harness/e2e.mjs

      - name: Proxy Docker image builds
        run: docker build -f proxy/Dockerfile -t worksheet-assistant-server:ci .

      - uses: actions/upload-artifact@v4
        with:
          name: worksheet-assistant-plugin
          path: |
            dist/worksheet-assistant.tar.gz
            dist/worksheet-assistant.zip
            dist/worksheet-assistant.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-folder
          path: dist/worksheet-assistant/

  # Desktop app (Tauri + Nuxt UI) with the companion as its server program, per platform (debug bundles).
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS: its Linux build does not need libatomic (Node >= 25 does)
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/download-artifact@v4
        with:
          name: plugin-folder
          path: dist/worksheet-assistant

      - name: Build
        run: |
          npm ci
          npm --prefix proxy ci
          npm --prefix desktop ci
          node scripts/build-desktop.mjs --target ${{ matrix.target }} -- --debug

      - name: Rust checks
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Smoke test (server program in app mode, MCP)
        run: |
          exe=desktop/src-tauri/binaries/worksheet-assistant-${{ matrix.target }}
          [ -f "$exe.exe" ] && exe="$exe.exe"
          # macOS: the copy inside the app bundle, signed by the bundler with the hardened runtime (JIT entitlements)
          app="desktop/src-tauri/target/${{ matrix.target }}/debug/bundle/macos/Arbeitsblatt-Assistent.app"
          if [ -d "$app" ]; then exe="$app/Contents/MacOS/worksheet-assistant"; codesign -dv --entitlements - "$exe" 2>&1 | tail -n 12; fi
          "$exe" version
          home="$(mktemp -d)"
          mkdir -p "$home/.local/share/euro-office/desktopeditors"
          secret=ci-secret-0123456789abcdef
          # stdin stays open for 40 s (the program quits when it closes); stdout carries JSON events
          (sleep 40) | HOME="$home" USERPROFILE="$home" APPDATA="$home/AppData/Roaming" LOCALAPPDATA="$home/AppData/Local" \
            XDG_CONFIG_HOME="$home/.config" WORKSHEET_ASSISTANT_UI_SECRET="$secret" \
            "$exe" --app --port 8799 > events.log 2> server.log &
          for i in $(seq 1 30); do grep -q '"event":"ready"' events.log && break; sleep 1; done
          cat events.log server.log
          grep -q '"event":"ready"' events.log
          curl -fs -H "x-companion-secret: $secret" http://127.0.0.1:8799/companion/api/state | head -c 300
          echo
          out="$(curl -fs -X POST http://127.0.0.1:8799/mcp -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"convert_german_notes","arguments":{"notes":"c fis g"}}}')"
          echo "${out:0:300}"
          # the tool result contains the converted tune (^F = fis)
          case "$out" in *'^F'*) echo "MCP ok" ;; *) echo "MCP call failed"; exit 1 ;; esac

      - name: Server program runs on a minimal Linux (no extra libraries)
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD/desktop/src-tauri/binaries:/wa:ro" ubuntu:22.04 /wa/worksheet-assistant-${{ matrix.target }} version

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/debug/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/debug/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/debug/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/debug/bundle/appimage/*.AppImage
