name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix proxy ci

      - name: Unit tests (shared ABC helpers + proxy)
        run: npm test

      - name: Build plugin
        run: bash scripts/build.sh

      - name: Install script (syntax, systemd unit)
        run: |
          bash -n scripts/install-aio.sh
          scripts/install-aio.sh --print-unit > /tmp/eurooffice-worksheet-assistant.service
          systemd-analyze verify /tmp/eurooffice-worksheet-assistant.service || true

      - name: End-to-end test (harness + mock proxy)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          PROXY_URL: http://localhost:8788
        run: |
          (cd proxy && LLM_PROVIDER=mock PROXY_TOKEN=dev-token-change-me-0123 \
            CORS_ORIGINS=http://localhost:8080 PORT=8788 LOG_LEVEL=warn node build/src/server.js &)
          node scripts/serve.mjs 8080 &
          for i in $(seq 1 30); do curl -fs http://localhost:8788/healthz && curl -fs -o /dev/null http://localhost:8080/harness/ && break; sleep 1; done
          node harness/e2e.mjs

      - name: Proxy Docker image builds
        run: docker build -f proxy/Dockerfile -t music-notation-proxy:ci .

      - uses: actions/upload-artifact@v4
        with:
          name: worksheet-assistant-plugin
          path: |
            dist/worksheet-assistant.tar.gz
            dist/worksheet-assistant.zip
            dist/worksheet-assistant.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-folder
          path: dist/worksheet-assistant/

  # Companion app for the desktop editors: single executable per platform (Node.js SEA).
  companion:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node --build-sea needs Node >= 25.5
          node-version: 26

      - uses: actions/download-artifact@v4
        with:
          name: plugin-folder
          path: dist/worksheet-assistant

      - name: Build the executable
        run: |
          npm ci
          npm --prefix proxy ci
          node scripts/build-companion.mjs

      - name: Smoke test
        run: |
          exe=dist/companion/arbeitsblatt-assistent
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" version
          home="$(mktemp -d)"
          mkdir -p "$home/.local/share/euro-office/desktopeditors"
          HOME="$home" USERPROFILE="$home" APPDATA="$home/AppData/Roaming" LOCALAPPDATA="$home/AppData/Local" \
            "$exe" --no-browser --port 8799 > companion.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8799/v1/meta && break; sleep 1; done
          echo
          out="$(curl -fs -X POST http://127.0.0.1:8799/mcp -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"convert_german_notes","arguments":{"notes":"c fis g"}}}')"
          echo "${out:0:300}"
          cat companion.log
          # the tool result contains the converted tune (^F = fis)
          case "$out" in *'^F'*) echo "MCP ok" ;; *) echo "MCP call failed"; exit 1 ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ runner.os }}-${{ runner.arch }}
          path: dist/arbeitsblatt-assistent-*
