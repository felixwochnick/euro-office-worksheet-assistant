# Server of the Euro-Office worksheet assistant: AI chat proxy and MCP endpoint.
#   cp .env.example .env   # then edit
#   docker compose up -d --build
services:
  music-proxy:
    build:
      context: ..
      dockerfile: proxy/Dockerfile
    image: music-notation-proxy:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8787"
    ports:
      - "${PROXY_PUBLISH_PORT:-8787}:8787"
    volumes:
      # sign-ins, OAuth clients and grants (AUTH_MODE=nextcloud)
      - proxy-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Optional local model via Ollama (OpenAI-compatible API):
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull qwen2.5:7b
  # and set LLM_PROVIDER=openai, LLM_BASE_URL=http://ollama:11434/v1, LLM_MODEL=qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  proxy-data:
  ollama:
