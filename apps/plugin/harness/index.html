<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Noten-Assistent – Test-Harness</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; font: 13px/1.4 Arial, sans-serif; display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr 160px; height: 100vh; background: #e8e8e8; }
    header { grid-column: 1 / 3; padding: 8px 12px; background: #446995; color: #fff; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    header #h-url, header #h-token { width: 220px; }
    header label { display: flex; gap: 4px; align-items: center; }
    #mock-doc { overflow-y: auto; background: #fff; margin: 12px; padding: 24px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    #mock-doc .el { padding: 3px 4px; border-left: 3px solid transparent; cursor: text; min-height: 18px; }
    #mock-doc .el.cursor { border-left-color: #e67e22; background: #fff8ef; }
    #mock-doc .el.heading { font-weight: bold; font-size: 15px; margin-top: 10px; }
    #mock-doc .idx { display: inline-block; width: 26px; color: #aaa; font-size: 10px; font-weight: normal; }
    #mock-doc img { display: block; margin: 4px 0 4px 26px; max-width: 100%; outline: 1px dashed #ccc; cursor: pointer; }
    #mock-doc img.selected { outline: 2px solid #e67e22; }
    #mock-doc table { border-collapse: collapse; margin: 4px 0 4px 26px; width: calc(100% - 26px); font-weight: normal; font-size: 13px; }
    #mock-doc td { border: 1px solid #888; padding: 2px 4px; }
    #mock-doc td img { display: inline; margin: 0 4px 0 0; outline: none; }
    #mock-doc .mock-header, #mock-doc .mock-footer { color: #777; font-size: 11px; border-bottom: 1px solid #ddd; margin-bottom: 8px; padding-bottom: 4px; }
    #mock-doc .mock-footer { border-bottom: 0; border-top: 1px solid #ddd; margin-top: 8px; padding-top: 4px; }
    #mock-doc .math { font-family: serif; font-style: italic; }
    #mock-doc td.shd { background: #eceef5; }
    #mock-doc table.box td { border-color: #4f46e5; background: #eef2ff; }
    #mock-doc .list.numbered::before { content: "1. "; color: #888; }
    #mock-doc .list.bullet::before { content: "• "; color: #888; }
    #mock-doc .el.line { border-bottom: 1px solid #333; height: 22px; margin-left: 26px; }
    #mock-doc .el.page-break { border-bottom: 2px dashed #aaa; }
    iframe { width: 380px; height: 100%; border: 0; border-left: 1px solid #bbb; background: #fff; grid-row: 2 / 4; grid-column: 2; }
    #mock-log { grid-column: 1; margin: 0 12px 12px; background: #222; color: #9f9; font: 11px monospace; padding: 6px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <strong>Test-Harness</strong>
    <label>Proxy-URL <input id="h-url" value="http://localhost:8787"></label>
    <label>Token <input id="h-token" value="dev-token-change-me-0123"></label>
    <button id="h-apply">Übernehmen &amp; Panel neu laden</button>
    <button id="h-reset">Dokument zurücksetzen</button>
    <label><input type="checkbox" id="h-fail"> CreateImage schlägt fehl</label>
    <label><input type="checkbox" id="h-legacy"> Ältere API (ohne SetDescription/GetCurrentParagraph)</label>
  </header>
  <div id="mock-doc" title="Klick = Cursor setzen, Klick auf Bild = Bild markieren"></div>
  <pre id="mock-log"></pre>
  <iframe id="panel" src="../../../dist/worksheet-assistant/index.html" title="Plugin-Panel"></iframe>

  <script src="mock-editor.js"></script>
  <script>
    (function () {
      var KEY = 'music-notation-plugin.settings.v1';
      var M = window.HarnessMock;
      M.resetDocument();

      function current() {
        try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
      }
      var s = current();
      if (s.proxyUrl) document.getElementById('h-url').value = s.proxyUrl;
      if (s.token) document.getElementById('h-token').value = s.token;
      if (!s.proxyUrl) {
        // Pre-configure the plugin (same origin -> shared localStorage).
        try {
          localStorage.setItem(KEY, JSON.stringify(Object.assign(s, {
            proxyUrl: document.getElementById('h-url').value,
            token: document.getElementById('h-token').value
          })));
        } catch (e) {}
      }

      document.getElementById('h-apply').addEventListener('click', function () {
        var cur = current();
        cur.proxyUrl = document.getElementById('h-url').value;
        cur.token = document.getElementById('h-token').value;
        try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (e) {}
        document.getElementById('panel').contentWindow.location.reload();
      });
      document.getElementById('h-reset').addEventListener('click', M.resetDocument);
      document.getElementById('h-fail').addEventListener('change', function (e) { M.state.options.failCreateImage = e.target.checked; });
      document.getElementById('h-legacy').addEventListener('change', function (e) { M.state.options.legacyApi = e.target.checked; });
    })();
  </script>
</body>
</html>
