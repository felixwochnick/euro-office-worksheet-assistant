[package]
name = "worksheet-assistant-app"
version = "0.9.0"
description = "Desktop app of the Euro-Office worksheet assistant"
authors = ["Felix Wochnick"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "worksheet_assistant_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
rand = "0.9"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
